aid: lenskart
name: Lenskart
description: 'Lenskart is a direct-to-consumer eyewear company operating an omnichannel
  retail business across prescription eyeglasses, sunglasses, contact lenses and eye-care
  services. It sells through localized storefronts (India, United States, Singapore
  and other markets) and mobile apps, and merchandises its own house brands including
  Vincent Chase, John Jacobs, Lenskart Studio and Lenskart Boost alongside third-party
  labels. The digital experience layer includes 3D/AR virtual try-on and look comparison,
  a saved-prescription and prescription-history profile, order tracking and a loyalty
  program. Lenskart is backed by SoftBank Vision Fund. As of this enrichment pass Lenskart
  publishes no public developer portal, API reference, OpenAPI definition or client
  SDKs; the developer- and docs-named subdomains that resolve are gated behind Cloudflare
  and return 403 to unauthenticated clients, so no API surface could be verified.'
